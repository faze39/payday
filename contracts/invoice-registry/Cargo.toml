[package]
name = "invoice-registry"
version = "0.1.0"
edition = "2021"
publish = false
# Requires rustc >= 1.88 (tested with 1.99.1).

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = { version = "5.5.0", default-features = false, features = ["unit-testing", "legacy"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
